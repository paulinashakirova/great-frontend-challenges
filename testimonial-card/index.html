<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testimonial Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Get started on Tailwind: https://tailwindcss.com/docs/installation/play-cdn -->

  <link rel="icon" href="img/favicon.ico" sizes="any" />
  <style>
    /* You may write styles inside this <style> tag or within `css/style.css`. */
  </style>

<body class="bg-[#F9FAFB] flex justify-center items-center">
  <div class="flex flex-col bg-white w-[340px] p-4">
    <div class="flex items-center mb-4">
      <img src="img/profile-thumbnail.png" class="size-16" alt="Smiling dark-haired woman. Profile photo" />
      <div class="flex flex-col ml-2">
        <h3 class="text-lg font-semibold text-neutral-900">
          Sarah Dole
        </h3>
        <p class="text-sm text-neutral-600">@sarahdole</p>
      </div>
    </div>
    <p class="text-base text-neutral-600">I've been searching for high-quality abstract images for my design projects,
      and I'm thrilled to have found this platform. The variety and depth of creativity are astounding! </p>
  </div>
  <!-- Attribute this challenge to yourself! -->
  <div class="credits" data-gfe-screenshot-exclude="true">
    A challenge by
    <a href="https://www.greatfrontend.com/projects?ref=challenges" target="_blank">GreatFrontEnd Projects</a>. Built by
    <a href="https://www.greatfrontend.com/projects/u/username" target="_blank">Paulina</a>.
  </div>
  <script src="js/index.js"></script>
</body>

</html>
